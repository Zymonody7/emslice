# conda env create -f environment.yml && conda activate emslice
name: emslice
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pyyaml
  - petsc=*=*real*      # 实数版 PETSc（复厄密矩阵经实嵌入处理）
  - petsc4py
  - mumps-mpi           # 由 petsc 依赖引入，对称不定 LDLᵀ + 惯性
  - slepc               # 仅用于基准对比
  - slepc4py
  - psutil
  - threadpoolctl
  - matplotlib          # 绘制报告图
  - scikit-fem          # 有限元基准算例（Nédélec 棱边元）
  - gmsh                # 有限元基准的曲面几何网格（作为外部程序调用）
  - pytest
